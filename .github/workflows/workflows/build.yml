name: Build osu!octave VPK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install VitaSDK
        run: |
          sudo rm -rf /usr/local/vitasdk
          git clone https://github.com/vitasdk/vdpm /tmp/vdpm
          cd /tmp/vdpm
          export VITASDK=/usr/local/vitasdk
          sudo mkdir -p $VITASDK
          sudo chown $USER $VITASDK
          sudo rm -rf /usr/local/vitasdk
          ./bootstrap-vitasdk.sh
          echo "VITASDK=/usr/local/vitasdk" >> $GITHUB_ENV
          echo "/usr/local/vitasdk/bin" >> $GITHUB_PATH

      - name: Install VitaSDK packages
        run: |
          export VITASDK=/usr/local/vitasdk
          export PATH=$VITASDK/bin:$PATH
          vdpm \
            SDL2 \
            SDL2_mixer \
            SDL2_image \
            SDL2_ttf \
            libpng \
            libjpeg \
            libwebp \
            freetype2 \
            libvorbis \
            libogg \
            libFLAC \
            mpg123 \
            libmikmod

      - name: Configure CMake
        run: |
          export VITASDK=/usr/local/vitasdk
          export PATH=$VITASDK/bin:$PATH
          cmake -S . -B build \
            -DBUILDTARGET=vita \
            -DCMAKE_TOOLCHAIN_FILE=$VITASDK/share/vita.toolchain.cmake

      - name: Build
        run: |
          export VITASDK=/usr/local/vitasdk
          export PATH=$VITASDK/bin:$PATH
          cmake --build build --parallel

      - name: Upload VPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: osu-octave-bgvideo
          path: build/osu-octave.vpk
          if-no-files-found: error
